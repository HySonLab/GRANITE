[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-ising"
version = "0.1.0"
description = "Educational GRANITE reproduction with exact edge labels and dynamic Ising compression"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "networkx>=3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["granite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
